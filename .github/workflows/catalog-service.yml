# CI de catalog-service
#
#   Catalog tests   ──┐
#                    ├──> Catalog Docker image
#   Catalog quality ──┘
#
# Pas de filtre "paths" : les contrôles requis doivent exister sur toutes les PR.
name: catalog-service

on:
  push:
    branches: [main]
  pull_request:

# Permissions minimales du GITHUB_TOKEN : lecture du code uniquement
permissions:
  contents: read

# Un nouveau push sur la même branche annule l'exécution devenue obsolète
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: catalog-service

jobs:
  tests:
    name: Catalog tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          # Cache du dépôt Maven local (~/.m2), clé calculée à partir du pom.xml
          cache: maven
          cache-dependency-path: catalog-service/pom.xml

      - name: Tests JUnit
        run: ./mvnw -B test

      # Rapports Surefire (XML JUnit), téléversés même si les tests échouent
      - name: Rapports de tests
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: catalog-test-reports
          path: catalog-service/target/surefire-reports/
          retention-days: 7
          if-no-files-found: warn

  quality:
    name: Catalog quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: catalog-service/pom.xml

      - name: Checkstyle
        run: ./mvnw -B checkstyle:check

      # Rapport Checkstyle (XML), téléversé même si des violations sont trouvées
      - name: Rapport Checkstyle
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: catalog-checkstyle-report
          path: catalog-service/target/checkstyle-result.xml
          retention-days: 7
          if-no-files-found: warn

  image:
    name: Catalog Docker image
    # L'image n'est construite que si les tests ET la qualité sont verts
    needs: [tests, quality]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # Connexion à Docker Hub uniquement pour un push sur main, jamais depuis une PR
      - name: Connexion à Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construction (et publication sur main)
        uses: docker/build-push-action@v6
        with:
          context: catalog-service
          # Les tests ont déjà tourné dans le job "tests" : inutile de les relancer
          build-args: SKIP_TESTS=true
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            herador/catalog-service:${{ github.sha }}
            herador/catalog-service:latest
          # Cache des couches Docker dans le cache GitHub Actions
          cache-from: type=gha,scope=catalog-service
          cache-to: type=gha,mode=max,scope=catalog-service
