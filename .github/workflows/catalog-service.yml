# CI de départ de catalog-service : un seul job qui teste puis construit l'image.
# Volontairement minimale : le TP 01 la découpe et la renforce.
name: catalog-service

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Tests
        working-directory: catalog-service
        run: ./mvnw -B test

      - name: Image Docker
        run: docker build -t catalog-service:ci catalog-service
