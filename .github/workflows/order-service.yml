# CI de départ de order-service : un seul job qui teste puis construit l'image.
# Volontairement minimale : le TP 01 la découpe et la renforce.
name: order-service

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Tests
        working-directory: order-service
        run: ./mvnw -B test

      - name: Image Docker
        run: docker build -t order-service:ci order-service
