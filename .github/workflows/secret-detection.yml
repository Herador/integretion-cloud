# Détection de secrets sur tout l'historique Git avec Gitleaks.
# Un secret supprimé dans un commit récent reste lisible dans les commits précédents :
# on analyse donc tout l'historique, pas seulement le dernier état du code.
name: secret-detection

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: "8.30.1"

jobs:
  gitleaks:
    name: Secret detection
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          # 0 = tout l'historique (par défaut, checkout ne récupère que le dernier commit)
          fetch-depth: 0

      # Binaire officiel, version épinglée et somme de contrôle vérifiée
      - name: Installation de Gitleaks
        working-directory: ${{ runner.temp }}
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfLO "${base}/${archive}"
          curl -sSfLO "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --check --ignore-missing "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tar -xzf "${archive}" gitleaks
          echo "${{ runner.temp }}" >> "$GITHUB_PATH"

      # --redact : les valeurs trouvées sont masquées dans le log et le rapport
      - name: Analyse de tout l'historique
        run: >
          gitleaks git .
          --redact
          --verbose
          --report-format sarif
          --report-path gitleaks-report.sarif

      - name: Rapport Gitleaks
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: gitleaks-report
          path: gitleaks-report.sarif
          retention-days: 7
          if-no-files-found: warn
