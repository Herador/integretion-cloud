spring.application.name=order-service
server.port=8080

# Adresse de catalog-service (surchargée par la variable d'environnement CATALOG_URL)
catalog.url=${CATALOG_URL:http://localhost:8080}

# Sondes Kubernetes /actuator/health/liveness et /actuator/health/readiness
management.endpoint.health.probes.enabled=true
management.endpoints.web.exposure.include=health

# Arrêt propre : Kubernetes envoie SIGTERM avant de supprimer un Pod
server.shutdown=graceful
